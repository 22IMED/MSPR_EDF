name: CD — Deploy to Azure Container Apps

on:
  workflow_run:
    workflows: ["CI — Lint & Tests"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: "Environnement cible"
        required: false
        default: "production"

env:
  RESOURCE_GROUP: mspr3-edf
  CONTAINER_APP_ENV: mspr3-env
  MLFLOW_APP_NAME: edf-mlflow
  API_APP_NAME: edf-api
  PIPELINE_JOB_NAME: edf-pipeline-job 

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  check:
    name: Vérification CI
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    steps:
      - name: CI status check
        run: |
          echo "CI passé ou déclenchement manuel. Déploiement autorisé."

  # ──────────────────────────────────────────────────────────────────────────
  deploy-pipeline-job:
    name: Deploy Pipeline Job
    runs-on: ubuntu-latest
    needs: check
    steps:
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy Pipeline Job
        run: |
          az containerapp job delete \
            --name ${{ env.PIPELINE_JOB_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --yes 2>/dev/null || true

          az containerapp job create \
            --name ${{ env.PIPELINE_JOB_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --environment ${{ env.CONTAINER_APP_ENV }} \
            --trigger-type Manual \
            --replica-timeout 3600 \
            --replica-retry-limit 1 \
            --replica-completion-count 1 \
            --parallelism 1 \
            --image ${{ secrets.ACR_LOGIN_SERVER }}/edf-pipeline:${{ github.sha }} \
            --cpu 2 --memory 4Gi \
            --min-executions 0 --max-executions 1 \
            --registry-server ${{ secrets.ACR_LOGIN_SERVER }} \
            --registry-username ${{ secrets.ACR_USERNAME }} \
            --registry-password ${{ secrets.ACR_PASSWORD }} \
            --env-vars \
              "MLFLOW_TRACKING_URI=http://${{ env.MLFLOW_APP_NAME }}" \
              "MLFLOW_EXPERIMENT=edf-consumption" \
              "SNOWFLAKE_ACCOUNT=${{ secrets.SNOWFLAKE_ACCOUNT }}" \
              "SNOWFLAKE_USER=${{ secrets.SNOWFLAKE_USER }}" \
              "SNOWFLAKE_PASSWORD=${{ secrets.SNOWFLAKE_PASSWORD }}" \
              "SNOWFLAKE_DATABASE=${{ secrets.SNOWFLAKE_DATABASE }}" \
              "SNOWFLAKE_SCHEMA=${{ secrets.SNOWFLAKE_SCHEMA }}" \
              "SNOWFLAKE_WAREHOUSE=${{ secrets.SNOWFLAKE_WAREHOUSE }}" \
              "AZURE_STORAGE_ACCOUNT=${{ secrets.AZURE_STORAGE_ACCOUNT }}" \
              "AZURE_STORAGE_KEY=${{ secrets.AZURE_STORAGE_KEY }}"
  deploy-mlflow:
    name: Deploy MLflow Server
    runs-on: ubuntu-latest
    needs: check

    steps:
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy MLflow Container App
        run: |
          az containerapp update \
            --name ${{ env.MLFLOW_APP_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --image ghcr.io/mlflow/mlflow:v2.13.2 \
            --set-env-vars \
              "BACKEND_STORE_URI=${{ secrets.MLFLOW_DB_URI }}" \
              "DEFAULT_ARTIFACT_ROOT=${{ secrets.MLFLOW_ARTIFACT_ROOT }}" \
          || az containerapp create \
            --name ${{ env.MLFLOW_APP_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --environment ${{ env.CONTAINER_APP_ENV }} \
            --image ghcr.io/mlflow/mlflow:v2.13.2 \
            --command "mlflow" \
            --args "server" "--host" "0.0.0.0" "--port" "5000" \
              "--backend-store-uri" "${{ secrets.MLFLOW_DB_URI }}" \
              "--default-artifact-root" "${{ secrets.MLFLOW_ARTIFACT_ROOT }}" \
            --cpu 0.5 \
            --memory 1Gi \
            --min-replicas 1 \
            --max-replicas 1 \
            --ingress internal \
            --target-port 5000 \
            --env-vars \
              "BACKEND_STORE_URI=${{ secrets.MLFLOW_DB_URI }}" \
              "DEFAULT_ARTIFACT_ROOT=${{ secrets.MLFLOW_ARTIFACT_ROOT }}"

      - name: Wait for MLflow
        run: sleep 30

  # ──────────────────────────────────────────────────────────────────────────
  deploy-api:
    name: Deploy EDF API
    runs-on: ubuntu-latest
    needs: deploy-mlflow

    steps:
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy API Container App
        run: |
          MLFLOW_URL="http://${{ env.MLFLOW_APP_NAME }}"

          az containerapp update \
            --name ${{ env.API_APP_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --image ${{ secrets.ACR_LOGIN_SERVER }}/edf-api:${{ github.sha }} \
            --set-env-vars \
              "MODELS_DIR=/app/models" \
              "DEFAULT_MODEL=random_forest" \
              "MLFLOW_TRACKING_URI=${MLFLOW_URL}" \
              "MLFLOW_EXPERIMENT=edf-consumption" \
              "DATA_SOURCE=${{ vars.DATA_SOURCE || 'snowflake' }}" \
              "SNOWFLAKE_ACCOUNT=${{ secrets.SNOWFLAKE_ACCOUNT }}" \
              "SNOWFLAKE_USER=${{ secrets.SNOWFLAKE_USER }}" \
              "SNOWFLAKE_PASSWORD=${{ secrets.SNOWFLAKE_PASSWORD }}" \
              "SNOWFLAKE_DATABASE=${{ secrets.SNOWFLAKE_DATABASE }}" \
              "SNOWFLAKE_SCHEMA=${{ secrets.SNOWFLAKE_SCHEMA }}" \
              "SNOWFLAKE_WAREHOUSE=${{ secrets.SNOWFLAKE_WAREHOUSE }}" \
          || az containerapp create \
            --name ${{ env.API_APP_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --environment ${{ env.CONTAINER_APP_ENV }} \
            --image ${{ secrets.ACR_LOGIN_SERVER }}/edf-api:${{ github.sha }} \
            --cpu 0.5 \
            --memory 1Gi \
            --min-replicas 1 \
            --max-replicas 3 \
            --ingress external \
            --target-port 8000 \
            --registry-server ${{ secrets.ACR_LOGIN_SERVER }} \
            --registry-username ${{ secrets.ACR_USERNAME }} \
            --registry-password ${{ secrets.ACR_PASSWORD }} \
            --env-vars \
              "MODELS_DIR=/app/models" \
              "DEFAULT_MODEL=random_forest" \
              "MLFLOW_TRACKING_URI=${MLFLOW_URL}" \
              "MLFLOW_EXPERIMENT=edf-consumption" \
              "DATA_SOURCE=${{ vars.DATA_SOURCE || 'snowflake' }}"

      - name: Get API URL
        id: api-url
        run: |
          API_URL=$(az containerapp show \
            --name ${{ env.API_APP_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --query "properties.configuration.ingress.fqdn" \
            --output tsv)
          echo "api_url=https://${API_URL}" >> $GITHUB_OUTPUT
          echo "API déployée : https://${API_URL}"

      - name: Output API URL
        run: echo "API URL = ${{ steps.api-url.outputs.api_url }}"

  # ──────────────────────────────────────────────────────────────────────────
  healthcheck:
    name: Healthcheck post-déploiement
    runs-on: ubuntu-latest
    needs: deploy-api

    steps:
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Récupération URL API
        id: get-url
        run: |
          API_URL=$(az containerapp show \
            --name ${{ env.API_APP_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --query "properties.configuration.ingress.fqdn" \
            --output tsv)
          echo "api_url=https://${API_URL}" >> $GITHUB_OUTPUT

      - name: Attente démarrage (60s)
        run: sleep 60

      - name: Healthcheck /health
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            "${{ steps.get-url.outputs.api_url }}/health" \
            --max-time 30)
          echo "HTTP Status : ${STATUS}"
          if [[ "${STATUS}" != "200" ]]; then
            echo "Healthcheck échoué (HTTP ${STATUS})"
            exit 1
          fi
          echo "Healthcheck OK."
  deploy-streamlit:
    name: Deploy Streamlit
    runs-on: ubuntu-latest
    needs: deploy-api
    steps:
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy Streamlit Container App
        run: |
          az containerapp update \
            --name edf-streamlit \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --image ${{ secrets.ACR_LOGIN_SERVER }}/edf-streamlit:${{ github.sha }} \
          || az containerapp create \
            --name edf-streamlit \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --environment ${{ env.CONTAINER_APP_ENV }} \
            --image ${{ secrets.ACR_LOGIN_SERVER }}/edf-streamlit:${{ github.sha }} \
            --cpu 0.5 --memory 1Gi \
            --min-replicas 1 --max-replicas 2 \
            --ingress external \
            --target-port 8501 \
            --registry-server ${{ secrets.ACR_LOGIN_SERVER }} \
            --registry-username ${{ secrets.ACR_USERNAME }} \
            --registry-password ${{ secrets.ACR_PASSWORD }} \
            --env-vars "API_URL=https://edf-api.orangebeach-b5cf8765.francecentral.azurecontainerapps.io"