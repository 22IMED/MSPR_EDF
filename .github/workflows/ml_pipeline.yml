name: ML Pipeline — Entraînement quotidien

on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:
    inputs:
      data_source:
        description: "Source de données"
        type: choice
        options:
          - snowflake
          - xls
        default: snowflake

env:
  RESOURCE_GROUP: mspr3-edf
  PIPELINE_JOB_NAME: edf-pipeline-job
  API_APP_NAME: edf-api
  MLFLOW_URL: https://edf-mlflow.orangebeach-b5cf8765.francecentral.azurecontainerapps.io

jobs:
  trigger:
    name: Déclencher pipeline Azure
    runs-on: ubuntu-latest
    outputs:
      execution_name: ${{ steps.start.outputs.execution_name }}
    steps:
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Créer expérience MLflow
        run: |
          curl -s -X POST \
            "${{ env.MLFLOW_URL }}/api/2.0/mlflow/experiments/create" \
            -H "Content-Type: application/json" \
            -d '{"name": "edf-consumption"}' || true

      - name: Start Container App Job
        id: start
        run: |
          DATA_SOURCE="${{ inputs.data_source || 'snowflake' }}"
          RUN_ID=$(python3 -c "import uuid; print(str(uuid.uuid4())[:8])")

          EXEC=$(az containerapp job start \
            --name ${{ env.PIPELINE_JOB_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --image ${{ secrets.ACR_LOGIN_SERVER }}/edf-pipeline:latest \
            --env-vars \
              "DATA_SOURCE=${DATA_SOURCE}" \
              "RUN_ID=${RUN_ID}" \
              "R2_THRESHOLD=0.85" \
              "MAPE_PRODUCTION_THRESHOLD=5.0" \
              "FORCE_SNOWFLAKE_WRITE=true" \
            --query "name" -o tsv)

          echo "execution_name=${EXEC}" >> $GITHUB_OUTPUT
          echo "Exécution démarrée : ${EXEC} (run_id=${RUN_ID})"

  wait:
    name: Attendre fin entraînement
    runs-on: ubuntu-latest
    needs: trigger
    steps:
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Polling statut (max 60 min)
        run: |
          EXEC="${{ needs.trigger.outputs.execution_name }}"
          for i in $(seq 1 60); do
            STATUS=$(az containerapp job execution show \
              --name ${{ env.PIPELINE_JOB_NAME }} \
              --resource-group ${{ env.RESOURCE_GROUP }} \
              --job-execution-name "${EXEC}" \
              --query "properties.status" -o tsv)
            echo "[$i/60] Statut : ${STATUS}"
            if [[ "${STATUS}" == "Succeeded" ]]; then
              echo "Pipeline terminé avec succès."
              exit 0
            elif [[ "${STATUS}" == "Failed" ]]; then
              echo "Pipeline échoué."
              exit 1
            fi
            sleep 60
          done
          echo "Timeout 60 min dépassé."
          exit 1

  restart-api:
    name: Restart API
    runs-on: ubuntu-latest
    needs: wait
    steps:
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Restart edf-api
        run: |
          az containerapp revision list \
            --name ${{ env.API_APP_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --query "[0].name" --output tsv \
          | xargs -I{} az containerapp revision restart \
            --name ${{ env.API_APP_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --revision {}

  notify:
    name: Résultat
    runs-on: ubuntu-latest
    needs: [wait, restart-api]
    if: always()
    steps:
      - name: Summary
        run: |
          echo "Pipeline : ${{ needs.wait.result }}"
          echo "Restart API : ${{ needs.restart-api.result }}"