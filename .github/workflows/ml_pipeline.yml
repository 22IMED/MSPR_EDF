name: ML Pipeline — Entraînement quotidien

on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:
    inputs:
      data_source:
        description: "Source de données"
        type: choice
        options:
          - snowflake
          - xls
        default: snowflake

env:
  RESOURCE_GROUP: mspr3-edf
  PIPELINE_JOB_NAME: edf-pipeline-job
  API_APP_NAME: edf-api

jobs:
  trigger:
    name: Déclencher pipeline Azure
    runs-on: ubuntu-latest
    outputs:
      execution_name: ${{ steps.start.outputs.execution_name }}
    steps:
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Start Container App Job
        id: start
        run: |
          DATA_SOURCE="${{ inputs.data_source || 'snowflake' }}"
          RUN_ID=$(python3 -c "import uuid; print(str(uuid.uuid4())[:8])")

          # --image removed: image is defined in the job definition, not at start time
          EXEC=$(az containerapp job start \
            --name ${{ env.PIPELINE_JOB_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --env-vars \
              "DATA_SOURCE=${DATA_SOURCE}" \
              "RUN_ID=${RUN_ID}" \
              "R2_THRESHOLD=0.85" \
              "MAPE_PRODUCTION_THRESHOLD=5.0" \
              "FORCE_SNOWFLAKE_WRITE=true" \
            --query "name" -o tsv)

          echo "execution_name=${EXEC}" >> $GITHUB_OUTPUT
          echo "Exécution démarrée : ${EXEC} (run_id=${RUN_ID})"

  wait:
    name: Attendre fin entraînement
    runs-on: ubuntu-latest
    needs: trigger
    steps:
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Polling statut (max 60 min)
        run: |
          EXEC="${{ needs.trigger.outputs.execution_name }}"
          for i in $(seq 1 60); do
            STATUS=$(az containerapp job execution show \
              --name ${{ env.PIPELINE_JOB_NAME }} \
              --resource-group ${{ env.RESOURCE_GROUP }} \
              --job-execution-name "${EXEC}" \
              --query "properties.status" -o tsv)
            echo "[$i/60] $(date -u '+%H:%M:%S') — Statut : ${STATUS}"
            if [[ "${STATUS}" == "Succeeded" ]]; then
              echo "✅ Pipeline terminé avec succès."
              exit 0
            elif [[ "${STATUS}" == "Failed" ]]; then
              echo "❌ Pipeline échoué. Récupération des logs..."
              az containerapp job execution logs show \
                --name ${{ env.PIPELINE_JOB_NAME }} \
                --resource-group ${{ env.RESOURCE_GROUP }} \
                --job-execution-name "${EXEC}" \
                --container ${{ env.PIPELINE_JOB_NAME }} || true
              exit 1
            fi
            sleep 60
          done
          echo "⏰ Timeout 60 min dépassé."
          exit 1

  restart-api:
    name: Restart API
    runs-on: ubuntu-latest
    needs: wait
    # Only restart if pipeline actually succeeded — avoids serving a broken model
    if: needs.wait.result == 'success'
    steps:
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Restart edf-api
        run: |
          az containerapp revision list \
            --name ${{ env.API_APP_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --query "[0].name" --output tsv \
          | xargs -I{} az containerapp revision restart \
            --name ${{ env.API_APP_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --revision {}

  notify:
    name: Résultat
    runs-on: ubuntu-latest
    needs: [wait, restart-api]
    if: always()
    steps:
      - name: Summary
        run: |
          echo "### Pipeline Result" >> $GITHUB_STEP_SUMMARY
          echo "- Entraînement : ${{ needs.wait.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Restart API  : ${{ needs.restart-api.result }}" >> $GITHUB_STEP_SUMMARY