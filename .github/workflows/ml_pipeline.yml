name: ML Pipeline — Entraînement quotidien

on:
  schedule:
    # - cron: "0 3 * * 1"  # 03h00 UTC chaque lundi
    - cron: "*/5 * * * *"  # toutes les 5 minutes
  workflow_dispatch:
    inputs:
      skip_snowflake:
        description: "Ignorer Snowflake (utiliser XLS)"
        type: boolean
        default: false
      data_source:
        description: "Source de données"
        type: choice
        options:
          - snowflake
          - xls
        default: snowflake

env:
  PYTHON_VERSION: "3.11"
  RESOURCE_GROUP: mspr3-edf
  API_APP_NAME: edf-api
  PIPELINE_JOB_NAME: edf-pipeline-job

jobs:
  ml-pipeline:
    name: Exécution Pipeline ML
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: pip install --no-cache-dir -r requirements.txt

      # ── Détermination source de données ────────────────────────────────────
      - name: Set data source
        id: datasource
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            SOURCE="${{ inputs.data_source }}"
          else
            SOURCE="snowflake"
          fi
          echo "source=${SOURCE}" >> $GITHUB_OUTPUT
          echo "Source de données : ${SOURCE}"

      # ── Azure Login (si nécessaire) ────────────────────────────────────────
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # ── Téléchargement données XLS depuis Azure Blob ───────────────────────
      - name: Download XLS data from Azure Blob
        if: steps.datasource.outputs.source == 'xls'
        run: |
          mkdir -p ./data
          az storage blob download-batch \
            --account-name ${{ secrets.AZURE_STORAGE_ACCOUNT }} \
            --account-key ${{ secrets.AZURE_STORAGE_KEY }} \
            --source eco2mix-data \
            --destination ./data \
            --pattern "*.xls" \
            2>/dev/null || echo "Aucun fichier .xls trouvé dans Azure Blob."
          ls -lh ./data/ || echo "Dossier data/ vide."

      # ── Step 1 : Extraction ───────────────────────────────────────────────
      - name: Step 1 — Extraction
        env:
          DATA_SOURCE: ${{ steps.datasource.outputs.source }}
          DATA_DIR: ./data
          SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
          SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
          SNOWFLAKE_PASSWORD: ${{ secrets.SNOWFLAKE_PASSWORD }}
          SNOWFLAKE_DATABASE: ${{ secrets.SNOWFLAKE_DATABASE }}
          SNOWFLAKE_SCHEMA: ${{ secrets.SNOWFLAKE_SCHEMA }}
          SNOWFLAKE_WAREHOUSE: ${{ secrets.SNOWFLAKE_WAREHOUSE }}
        run: |
          RUN_ID=$(python -c "import uuid; print(str(uuid.uuid4())[:8])")
          echo "RUN_ID=${RUN_ID}" >> $GITHUB_ENV
          python -c "from pipeline.steps import run_extract; run_extract('${RUN_ID}')"

      # ── Step 2 : Nettoyage ────────────────────────────────────────────────
      - name: Step 2 — Nettoyage
        run: python -c "from pipeline.steps import run_clean; run_clean('${{ env.RUN_ID }}')"

      # ── Step 3 : Agrégation ───────────────────────────────────────────────
      - name: Step 3 — Agrégation journalière
        run: python -c "from pipeline.steps import run_aggregate; run_aggregate('${{ env.RUN_ID }}')"

      # ── Step 4 : Feature engineering ──────────────────────────────────────
      - name: Step 4 — Feature engineering
        run: python -c "from pipeline.steps import run_features; run_features('${{ env.RUN_ID }}')"

      # ── Step 5 : Split ────────────────────────────────────────────────────
      - name: Step 5 — Split train/val/test
        run: python -c "from pipeline.steps import run_load_splits; run_load_splits('${{ env.RUN_ID }}')"

      # ── Step 6 : Entraînement ─────────────────────────────────────────────
      - name: Step 6 — Entraînement modèles
        env:
          MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI || 'http://localhost:5000' }}
          MLFLOW_EXPERIMENT: edf-consumption
        run: python -c "from pipeline.steps import run_train; run_train('${{ env.RUN_ID }}')"

      # ── Step 7 : Validation + vérification R² ────────────────────────────
      - name: Step 7 — Validation
        env:
          R2_THRESHOLD: "0.85"
          MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI || 'http://localhost:5000' }}
        run: |
          python -c "
          from pipeline.steps import run_validate
          import json, sys
          from pathlib import Path

          best = run_validate('${{ env.RUN_ID }}')
          print(f'Meilleur modèle : {best}')

          # Vérification seuil R²
          meta_path = Path('artifacts/${{ env.RUN_ID }}/meta.json')
          if meta_path.exists():
              meta = json.loads(meta_path.read_text())
              r2 = meta.get('r2_test', 0)
              threshold = float('${{ env.R2_THRESHOLD }}')
              print(f'R² test = {r2:.4f} (seuil = {threshold})')
              if r2 < threshold:
                  print(f'ERREUR : R² {r2:.4f} < seuil {threshold}', file=sys.stderr)
                  sys.exit(1)
              print('Seuil R² validé.')
          "

      # ── Step 8 : Enregistrement MLflow ────────────────────────────────────
      - name: Step 8 — Enregistrement MLflow Registry
        env:
          MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI || 'http://localhost:5000' }}
          MAPE_PRODUCTION_THRESHOLD: "5.0"
        run: python -c "from pipeline.steps import run_register_model; run_register_model('${{ env.RUN_ID }}')"

      # ── Step 9 : Prédictions ──────────────────────────────────────────────
      - name: Step 9 — Génération prédictions
        run: python -c "from pipeline.steps import run_predictions; run_predictions('${{ env.RUN_ID }}')"

      # ── Step 10 : Écriture Snowflake ──────────────────────────────────────
      - name: Step 10 — Écriture Snowflake
        env:
          DATA_SOURCE: ${{ steps.datasource.outputs.source }}
          FORCE_SNOWFLAKE_WRITE: "true"
          SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
          SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
          SNOWFLAKE_PASSWORD: ${{ secrets.SNOWFLAKE_PASSWORD }}
          SNOWFLAKE_DATABASE: ${{ secrets.SNOWFLAKE_DATABASE }}
          SNOWFLAKE_SCHEMA: ${{ secrets.SNOWFLAKE_SCHEMA }}
          SNOWFLAKE_WAREHOUSE: ${{ secrets.SNOWFLAKE_WAREHOUSE }}
        run: python -c "from pipeline.steps import run_write_snowflake; run_write_snowflake('${{ env.RUN_ID }}')"

      # ── Upload modèle vers Azure Blob ─────────────────────────────────────
      - name: Upload models to Azure Blob
        run: |
          for f in models/*.joblib models/*.metrics.json; do
            [[ -f "$f" ]] || continue
            az storage blob upload \
              --account-name ${{ secrets.AZURE_STORAGE_ACCOUNT }} \
              --account-key ${{ secrets.AZURE_STORAGE_KEY }} \
              --container-name models \
              --name "$(basename $f)" \
              --file "$f" \
              --overwrite \
              && echo "Uploadé : $f" \
              || echo "Échec upload : $f"
          done

      # ── Restart API ───────────────────────────────────────────────────────
      - name: Restart edf-api Container App
        run: |
          az containerapp revision list \
            --name ${{ env.API_APP_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --query "[0].name" --output tsv \
          | xargs -I{} az containerapp revision restart \
            --name ${{ env.API_APP_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --revision {} \
          && echo "API redémarrée." \
          || echo "Restart API échoué (non bloquant)."

      # ── Upload artifacts GitHub ───────────────────────────────────────────
      - name: Upload pipeline artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-artifacts-${{ env.RUN_ID }}
          path: |
            artifacts/${{ env.RUN_ID }}/
            models/*.metrics.json
          retention-days: 30

      # ── Notification succès/échec ─────────────────────────────────────────
      - name: Pipeline summary
        if: always()
        run: |
          if [[ "${{ job.status }}" == "success" ]]; then
            echo "✅ Pipeline ML terminé avec succès (run_id=${{ env.RUN_ID }})"
          else
            echo "❌ Pipeline ML ÉCHOUÉ (run_id=${{ env.RUN_ID }})"
          fi