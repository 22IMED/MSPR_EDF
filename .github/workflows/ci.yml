name: CI — Lint & Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  PYTHON_VERSION: "3.11"
  REGISTRY: ${{ secrets.ACR_LOGIN_SERVER }}

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  test:
    name: Lint & Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install --no-cache-dir -r requirements.txt

      - name: Ruff lint
        run: ruff check . --output-format=github

      - name: Ruff format check
        run: ruff format --check .

      - name: Run tests
        env:
          DATA_SOURCE: xls
          MLFLOW_TRACKING_URI: http://localhost:5000
          MODELS_DIR: ./models
          DATA_DIR: ./data
          USE_AZURE_STORAGE: "false"
        run: |
          pytest tests/ \
            -v \
            --tb=short \
            --junitxml=junit.xml \
            -p no:warnings

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: junit.xml
          retention-days: 14

  # ──────────────────────────────────────────────────────────────────────────
  build:
    name: Build & Push Docker images
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to Azure Container Registry
        uses: azure/docker-login@v2
        with:
          login-server: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & Push edf-api
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/api/Dockerfile
          push: true
          tags: |
            ${{ secrets.ACR_LOGIN_SERVER }}/edf-api:latest
            ${{ secrets.ACR_LOGIN_SERVER }}/edf-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & Push edf-pipeline
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/pipeline/Dockerfile
          push: true
          tags: |
            ${{ secrets.ACR_LOGIN_SERVER }}/edf-pipeline:latest
            ${{ secrets.ACR_LOGIN_SERVER }}/edf-pipeline:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max