name: CI — Lint & Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  PYTHON_VERSION: "3.11"
  REGISTRY: ${{ secrets.ACR_LOGIN_SERVER }}

jobs:
  checkout:
    name: Checkout & Install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install --no-cache-dir -r requirements.txt

  lint:
    name: Ruff lint
    runs-on: ubuntu-latest
    needs: checkout
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install --no-cache-dir -r requirements.txt
      - run: ruff check . --output-format=github

  format:
    name: Ruff format
    runs-on: ubuntu-latest
    needs: checkout
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install --no-cache-dir -r requirements.txt
      - run: ruff format --check .

  test:
    name: Pytest
    runs-on: ubuntu-latest
    needs: checkout
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install --no-cache-dir -r requirements.txt
      - name: Run tests
        env:
          DATA_SOURCE: xls
          MLFLOW_TRACKING_URI: http://localhost:5000
          MODELS_DIR: ./models
          DATA_DIR: ./data
          USE_AZURE_STORAGE: "false"
        run: |
          pytest tests/ \
            -v \
            --tb=short \
            --junitxml=junit.xml \
            -p no:warnings
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: junit.xml
          retention-days: 14

  build:
    name: Build & Push Docker images
    runs-on: ubuntu-latest
    needs: [lint, format, test]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: azure/docker-login@v2
        with:
          login-server: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/api/Dockerfile
          push: true
          tags: |
            ${{ secrets.ACR_LOGIN_SERVER }}/edf-api:latest
            ${{ secrets.ACR_LOGIN_SERVER }}/edf-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/pipeline/Dockerfile
          push: true
          tags: |
            ${{ secrets.ACR_LOGIN_SERVER }}/edf-pipeline:latest
            ${{ secrets.ACR_LOGIN_SERVER }}/edf-pipeline:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max