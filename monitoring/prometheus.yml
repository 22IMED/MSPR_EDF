global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'edf-api'
    static_configs:
      - targets: ['${API_HOST:-host.docker.internal:8000}']
    metrics_path: '/metrics'
    scheme: '${API_SCHEME:-http}'

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']