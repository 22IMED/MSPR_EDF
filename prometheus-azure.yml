global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'edf-api'
    metrics_path: '/metrics'
    scheme: 'https'
    static_configs:
      - targets: ['edf-api.orangebeach-b5cf8765.francecentral.azurecontainerapps.io']

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
