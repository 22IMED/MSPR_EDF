properties:
  template:
    containers:
    - name: edf-prometheus
      image: prom/prometheus:v2.51.0
      command:
      - /bin/sh
      args:
      - -c
      - |
        printf 'global:\n  scrape_interval: 15s\nscrape_configs:\n  - job_name: edf-api\n    static_configs:\n      - targets:\n        - edf-api.orangebeach-b5cf8765.francecentral.azurecontainerapps.io\n    metrics_path: /metrics\n    scheme: https\n    tls_config:\n      insecure_skip_verify: true\n' > /tmp/prometheus.yml && prometheus --config.file=/tmp/prometheus.yml --web.enable-lifecycle
      resources:
        cpu: 0.5
        memory: 1Gi
  scale:
    minReplicas: 1
    maxReplicas: 1
